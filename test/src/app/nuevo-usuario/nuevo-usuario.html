<div class="max-w-md mx-auto mt-8 p-6 bg-white rounded-lg shadow">
  <h2 class="text-2xl font-semibold mb-4">Crear Nuevo Usuario</h2>

  <form (ngSubmit)="guardarUsuario()" #usuarioForm="ngForm">
    <div class="mb-4">
      <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Nombre de usuario</label>
      <input 
        type="text" 
        id="username" 
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        [(ngModel)]="nuevoUsuario.username" 
        name="username" 
        required>
    </div>

    <div class="mb-4">
      <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
      <input 
        type="password" 
        id="password" 
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        [(ngModel)]="nuevoUsuario.password" 
        name="password" 
        required>
    </div>

    <button 
      type="submit" 
      class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed"
      [disabled]="!usuarioForm.form.valid">
      Guardar Usuario
    </button>
  </form>

  <div *ngIf="mensajeError" class="mt-3 p-3 bg-red-100 text-red-700 rounded-md">
    {{ mensajeError }}
  </div>
</div>
